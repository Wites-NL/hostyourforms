<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <!-- Only needed when the form has a turnstile captcha configured (see README for hCaptcha, reCAPTCHA, Friendly Captcha and ALTCHA) -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea { width: 100%; padding: .5rem; font: inherit; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; font: inherit; }
    .hp { position: absolute; left: -9999px; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Neem contact op</h1>

  <!--
    Works without JavaScript: the browser posts the form and HostYourForms
    redirects to the "redirect" URL from forms.json.
  -->
  <form id="contact" action="https://forms.example.com/f/contact" method="POST">
    <label for="name">Naam</label>
    <input id="name" name="name" required>

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Bericht</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <!-- Honeypot: humans leave it empty, bots fill it in -->
    <div class="hp" aria-hidden="true">
      <label for="_gotcha">Laat dit veld leeg</label>
      <input id="_gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <!-- Optional: overrides "redirect" (must be on an allowed origin) -->
    <input type="hidden" name="_redirect" value="https://example.com/bedankt">

    <div class="cf-turnstile" data-sitekey="JOUW_TURNSTILE_SITEKEY"></div>

    <button type="submit">Versturen</button>
    <p id="status" role="status"></p>
  </form>

  <!-- Optional progressive enhancement: submit without leaving the page -->
  <script>
    const form = document.getElementById("contact");
    const status = document.getElementById("status");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Bezig met versturen…";
      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" },
        });
        const data = await res.json();
        if (data.ok) {
          form.reset();
          status.textContent = "Bedankt! Je bericht is verstuurd.";
        } else {
          status.textContent = data.message || "Er ging iets mis.";
        }
      } catch {
        status.textContent = "Er ging iets mis, probeer het later opnieuw.";
      }
      if (window.turnstile) window.turnstile.reset();
    });
  </script>
</body>
</html>
